name: Format
on:
  pull_request:
    branches: [main]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run format
        if: github.actor != 'dependabot[bot]'

      - name: Commit changes
        if: github.actor != 'dependabot[bot]'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes detected by Prettier. Exiting gracefully."
            exit 0
            # The rest of the script must be within the same step to really stop the execution
          fi
          # Add changes
          git add .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Unstage workflow files
          git reset .github/workflows/*.yaml
          # Exit if nothing to commit
          if git diff --cached --quiet; then
            echo "No changes to commit after removing workflow files. Exiting gracefully."
            exit 0
          fi
          git commit -m "Prettify!"
          git push
        shell: bash
